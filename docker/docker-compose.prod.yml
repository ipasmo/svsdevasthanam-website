version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: svs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-svs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-svs_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - svs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svs_user} -d ${POSTGRES_DB:-svs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: svs-backend
    restart: always
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-svs_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-svs_db}?schema=public
      NODE_ENV: production
    networks:
      - svs-net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/main"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: svs-frontend
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - svs-net

  nginx:
    image: nginx:1.27-alpine
    container_name: svs-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - svs-net
    depends_on:
      - frontend
      - backend

volumes:
  pgdata_prod:
  certbot_www:

networks:
  svs-net:
    driver: bridge
