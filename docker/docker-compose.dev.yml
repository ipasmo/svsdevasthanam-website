services:
  minio:
    image: minio/minio:latest
    container_name: svs-minio-dev
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the default bucket on first start
  minio-init:
    image: minio/mc:latest
    container_name: svs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/svs-devastanam-media;
        mc anonymous set public local/svs-devastanam-media;
        echo 'Bucket ready.';
      "

  postgres:
    image: postgres:16-alpine
    container_name: svs-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: svs_user
      POSTGRES_PASSWORD: svs_pass
      POSTGRES_DB: svs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svs_user -d svs_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: svs-backend-dev
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://svs_user:svs_pass@postgres:5432/svs_db?schema=public
      NODE_ENV: development
      # MinIO local S3 — overrides .env values for Docker
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET: svs-devastanam-media
      AWS_REGION: us-east-1
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: npm run start:dev

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: svs-frontend-dev
    restart: unless-stopped
    env_file: ../frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NODE_ENV: development
      # MinIO public URL (accessed from the browser on the host)
      NEXT_PUBLIC_S3_BUCKET_URL: http://localhost:9000/svs-devastanam-media
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  pgdata_dev:
  minio_data_dev:
